    <p class="project-intro">
      NEXUS는 일상적인 거울에 디지털 경험을 연결한 스마트 미러 브랜드입니다. 스마트 필름을 통해 평소에는 거울로,<br>
      필요할 때는 개인에게 필요한 정보를 제공하는 디지털 인터페이스로 전환됩니다.<br>
      일상과 기술이 자연스럽게 이어지는 새로운 정보 경험을 제안합니다.
    </p>
